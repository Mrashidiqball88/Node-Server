<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyRide — Customer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0f;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* ── Auth Screen ── */
#auth-screen{position:fixed;inset:0;z-index:1000;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.auth-logo{font-size:2rem;font-weight:800;margin-bottom:.25rem}.auth-logo span{color:#f5c518}
.auth-subtitle{color:#555;font-size:.85rem;margin-bottom:2rem}
.auth-card{background:#13131a;border:1px solid #222;border-radius:20px;padding:1.5rem;width:100%;max-width:360px}
.auth-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;background:#0a0a0f;border-radius:10px;padding:.25rem}
.auth-tab{flex:1;padding:.6rem;border:none;background:transparent;color:#666;border-radius:8px;font-size:.9rem;cursor:pointer;transition:all .2s}
.auth-tab.active{background:#f5c518;color:#0a0a0f;font-weight:700}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.8rem;color:#888;margin-bottom:.4rem}
.form-group input,.form-group select{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:10px;padding:.75rem 1rem;color:#fff;font-size:.95rem;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:#f5c518}
.form-group select option{background:#13131a}
.btn-primary{width:100%;background:#f5c518;color:#0a0a0f;border:none;border-radius:12px;padding:.85rem;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.auth-error{color:#ff5555;font-size:.85rem;text-align:center;margin-top:.75rem;min-height:1.2em}

/* ── App Layout ── */
#app{display:none;flex-direction:column;height:100dvh}
#map{flex:1;z-index:1}

/* ── Header ── */
.header{background:#13131a;border-bottom:1px solid #222;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;z-index:10;flex-shrink:0}
.header-logo{font-size:1.2rem;font-weight:800}.header-logo span{color:#f5c518}
.header-user{display:flex;align-items:center;gap:.5rem}
.avatar{width:32px;height:32px;background:#f5c518;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0a0f;font-size:.85rem}
.header-name{font-size:.85rem;color:#ccc}
.btn-logout{background:none;border:1px solid #333;color:#888;border-radius:8px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer}

/* ── Bottom Panel ── */
#bottom-panel{background:#13131a;border-top:1px solid #222;max-height:55vh;overflow-y:auto;flex-shrink:0;z-index:10}
.tabs{display:flex;border-bottom:1px solid #222;background:#0a0a0f}
.tab{flex:1;padding:.75rem;border:none;background:transparent;color:#666;font-size:.8rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.tab.active{color:#f5c518;border-bottom:2px solid #f5c518}
.tab-icon{font-size:1.1rem}
.tab-content{display:none;padding:1rem}
.tab-content.active{display:block}

/* ── Book Tab ── */
.input-group{position:relative;margin-bottom:.75rem}
.pin-indicator{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);font-size:1rem;z-index:1}
.location-input{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:12px;padding:.75rem 1rem .75rem 2.5rem;color:#fff;font-size:.9rem;outline:none;transition:border-color .2s}
.location-input:focus{border-color:#f5c518}
.location-input.has-val{border-color:#2d5a2d}
.divider-line{display:flex;align-items:center;gap:.5rem;margin:.25rem 0;color:#444;font-size:.7rem}
.divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:#222}

.vehicle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.75rem 0}
.vehicle-btn{background:#0a0a0f;border:1px solid #333;border-radius:10px;padding:.6rem .3rem;cursor:pointer;text-align:center;transition:all .2s;color:#fff}
.vehicle-btn.active{background:#1a2a0a;border-color:#f5c518;color:#f5c518}
.vehicle-btn .v-icon{font-size:1.3rem}
.vehicle-btn .v-name{font-size:.65rem;margin-top:.2rem;color:inherit}
.vehicle-btn .v-fare{font-size:.6rem;color:#888}
.vehicle-btn.active .v-fare{color:#a0a060}

.fare-row{display:flex;justify-content:space-between;align-items:center;background:#0a0a0f;border-radius:10px;padding:.75rem 1rem;margin:.5rem 0}
.fare-label{color:#888;font-size:.85rem}
.fare-amount{font-size:1.2rem;font-weight:700;color:#f5c518}

.map-hint{background:#1a1a2a;border:1px dashed #333;border-radius:10px;padding:.6rem 1rem;text-align:center;color:#666;font-size:.8rem;margin-bottom:.75rem}
.map-hint.pickup-mode{border-color:#2266cc;color:#6699ff}
.map-hint.dropoff-mode{border-color:#cc6622;color:#ff9966}

/* ── Ride Status Panel ── */
#active-ride{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#13131a;border-top:2px solid #f5c518;padding:1rem}
.ride-status-badge{display:inline-flex;align-items:center;gap:.4rem;background:#1a2a0a;border:1px solid #4caf50;border-radius:100px;padding:.25rem .75rem;font-size:.75rem;color:#4caf50;margin-bottom:.75rem}
.ride-status-dot{width:6px;height:6px;background:#4caf50;border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ride-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.ride-info-card{background:#0a0a0f;border-radius:10px;padding:.6rem .8rem}
.ride-info-label{color:#666;font-size:.7rem;margin-bottom:.2rem}
.ride-info-val{font-size:.9rem;font-weight:600}
.ride-actions{display:flex;gap:.5rem}
.btn-danger{flex:1;background:#2a0a0a;border:1px solid #cc3333;color:#ff6666;border-radius:10px;padding:.6rem;font-size:.85rem;cursor:pointer}
.btn-secondary{flex:1;background:#0a0a1a;border:1px solid #333;color:#aaa;border-radius:10px;padding:.6rem;font-size:.85rem;cursor:pointer}

/* ── Wallet Tab ── */
.wallet-balance{background:linear-gradient(135deg,#1a2a0a,#0a1a0a);border:1px solid #2d5a2d;border-radius:16px;padding:1.25rem;margin-bottom:1rem;text-align:center}
.balance-label{color:#888;font-size:.8rem;margin-bottom:.25rem}
.balance-amount{font-size:2rem;font-weight:800;color:#4caf50}
.balance-currency{font-size:1rem;color:#888;margin-left:.25rem}
.add-funds-row{display:flex;gap:.5rem;margin-bottom:1rem}
.amount-input{flex:1;background:#0a0a0f;border:1px solid #333;border-radius:10px;padding:.6rem 1rem;color:#fff;font-size:.9rem;outline:none}
.btn-add{background:#f5c518;color:#0a0a0f;border:none;border-radius:10px;padding:.6rem 1.2rem;font-weight:700;cursor:pointer;white-space:nowrap}
.tx-list{display:flex;flex-direction:column;gap:.5rem}
.tx-item{display:flex;justify-content:space-between;align-items:center;background:#0a0a0f;border-radius:10px;padding:.6rem .8rem}
.tx-desc{font-size:.85rem;color:#ccc}
.tx-date{font-size:.7rem;color:#555;margin-top:.1rem}
.tx-amount{font-size:.9rem;font-weight:600}
.tx-amount.credit{color:#4caf50}
.tx-amount.debit{color:#ff5555}
.empty-msg{text-align:center;color:#444;padding:2rem;font-size:.9rem}

/* ── Rides Tab ── */
.ride-history-item{background:#0a0a0f;border-radius:12px;padding:.75rem;margin-bottom:.6rem;border-left:3px solid #333}
.ride-history-item.completed{border-left-color:#4caf50}
.ride-history-item.cancelled{border-left-color:#ff5555}
.rh-route{font-size:.85rem;margin-bottom:.4rem}
.rh-route span{color:#888}
.rh-meta{display:flex;justify-content:space-between;font-size:.75rem;color:#666}
.rh-fare{color:#f5c518;font-weight:600}
.status-pill{display:inline-block;padding:.15rem .5rem;border-radius:100px;font-size:.65rem;font-weight:600;text-transform:uppercase}
.status-pill.completed{background:#1a3a1a;color:#4caf50}
.status-pill.cancelled{background:#3a1a1a;color:#ff5555}
.status-pill.requested{background:#2a2a1a;color:#f5c518}
.status-pill.accepted,.status-pill.arrived,.status-pill.in-progress{background:#1a2a3a;color:#66aaff}

/* ── SOS Button ── */
#sos-btn{position:fixed;bottom:calc(var(--panel-h, 56px) + 1rem);right:1rem;z-index:40;width:52px;height:52px;background:#cc0000;border:none;border-radius:50%;color:#fff;font-size:.75rem;font-weight:700;cursor:pointer;box-shadow:0 0 0 4px rgba(204,0,0,.25);animation:sos-pulse 2s infinite;display:none}
@keyframes sos-pulse{0%,100%{box-shadow:0 0 0 4px rgba(204,0,0,.25)}50%{box-shadow:0 0 0 8px rgba(204,0,0,.1)}}

/* ── Toast ── */
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:#222;border-radius:10px;padding:.6rem 1.2rem;font-size:.85rem;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.show{opacity:1}
.toast.success{border-left:3px solid #4caf50}
.toast.error{border-left:3px solid #ff5555}
.toast.info{border-left:3px solid #f5c518}

/* ── Leaflet overrides ── */
.leaflet-container{background:#1a1a2a}
.pickup-marker{background:#2266cc;border:3px solid #fff;width:18px;height:18px;border-radius:50%;box-shadow:0 0 8px rgba(34,102,204,.8)}
.dropoff-marker{background:#cc6622;border:3px solid #fff;width:18px;height:18px;border-radius:50%;box-shadow:0 0 8px rgba(204,102,34,.8)}
.driver-marker{font-size:24px;line-height:1}
</style>
</head>
<body>

<!-- ── AUTH SCREEN ── -->
<div id="auth-screen">
  <div class="auth-logo">My<span>Ride</span></div>
  <p class="auth-subtitle">Customer Portal</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none">
      <div class="form-group"><label>Full Name</label><input type="text" id="r-name" placeholder="Your name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="you@email.com"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="r-phone" placeholder="+92 300 0000000"></div>
      <div class="form-group"><label>Password</label><input type="password" id="r-pass" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
    </div>

    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div class="header">
    <div class="header-logo">My<span>Ride</span></div>
    <div class="header-user">
      <div class="avatar" id="avatar-init">?</div>
      <div class="header-name" id="header-name">Loading…</div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-panel">
    <div class="tabs">
      <button class="tab active" onclick="switchAppTab('book')"><span class="tab-icon">📍</span>Book</button>
      <button class="tab" onclick="switchAppTab('rides')"><span class="tab-icon">🚗</span>Rides</button>
      <button class="tab" onclick="switchAppTab('wallet')"><span class="tab-icon">💰</span>Wallet</button>
    </div>

    <!-- BOOK TAB -->
    <div class="tab-content active" id="tab-book">
      <div class="map-hint" id="map-hint">Tap on the map to set <strong>pickup</strong> location</div>

      <div class="input-group">
        <span class="pin-indicator">📍</span>
        <input class="location-input" id="pickup-input" placeholder="Pickup location — tap map" readonly>
      </div>
      <div class="divider-line">↕</div>
      <div class="input-group">
        <span class="pin-indicator">🎯</span>
        <input class="location-input" id="dropoff-input" placeholder="Dropoff location — tap map" readonly>
      </div>

      <div class="vehicle-grid">
        <button class="vehicle-btn active" data-type="Bike" onclick="selectVehicle(this)">
          <div class="v-icon">🛵</div><div class="v-name">Bike</div><div class="v-fare">Rs 30/km</div>
        </button>
        <button class="vehicle-btn" data-type="Rickshaw" onclick="selectVehicle(this)">
          <div class="v-icon">🛺</div><div class="v-name">Rickshaw</div><div class="v-fare">Rs 40/km</div>
        </button>
        <button class="vehicle-btn" data-type="Car Mini" onclick="selectVehicle(this)">
          <div class="v-icon">🚙</div><div class="v-name">Car Mini</div><div class="v-fare">Rs 50/km</div>
        </button>
        <button class="vehicle-btn" data-type="Car AC" onclick="selectVehicle(this)">
          <div class="v-icon">🚗</div><div class="v-name">Car AC</div><div class="v-fare">Rs 70/km</div>
        </button>
      </div>

      <div class="fare-row" id="fare-row" style="display:none">
        <span class="fare-label">Estimated Fare</span>
        <span class="fare-amount" id="fare-display">Rs 0</span>
      </div>

      <button class="btn-primary" id="book-btn" onclick="bookRide()" style="display:none">Book Ride 🚗</button>
    </div>

    <!-- RIDES TAB -->
    <div class="tab-content" id="tab-rides">
      <div id="ride-history-list"><div class="empty-msg">Loading your rides…</div></div>
    </div>

    <!-- WALLET TAB -->
    <div class="tab-content" id="tab-wallet">
      <div class="wallet-balance">
        <div class="balance-label">Available Balance</div>
        <div><span class="balance-amount" id="wallet-balance">0</span><span class="balance-currency">PKR</span></div>
      </div>
      <div class="add-funds-row">
        <input type="number" class="amount-input" id="fund-amount" placeholder="Enter amount (PKR)" min="100">
        <button class="btn-add" onclick="addFunds()">Add Funds</button>
      </div>
      <div class="tx-list" id="tx-list"><div class="empty-msg">No transactions yet</div></div>
    </div>
  </div>
</div>

<!-- Active Ride Panel -->
<div id="active-ride">
  <div class="ride-status-badge"><span class="ride-status-dot"></span><span id="ride-status-text">Finding driver…</span></div>
  <div class="ride-info-grid">
    <div class="ride-info-card"><div class="ride-info-label">Driver</div><div class="ride-info-val" id="ar-driver">—</div></div>
    <div class="ride-info-card"><div class="ride-info-label">Fare</div><div class="ride-info-val" id="ar-fare">—</div></div>
    <div class="ride-info-card"><div class="ride-info-label">Vehicle</div><div class="ride-info-val" id="ar-vehicle">—</div></div>
    <div class="ride-info-card"><div class="ride-info-label">ETA</div><div class="ride-info-val" id="ar-eta">—</div></div>
  </div>
  <div class="ride-actions">
    <button class="btn-danger" onclick="cancelRide()">Cancel Ride</button>
    <button class="btn-secondary" onclick="shareLocation()">📍 Share Location</button>
  </div>
</div>

<!-- SOS Button -->
<button id="sos-btn" onclick="triggerSOS()">🆘<br>SOS</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const API = '';
const FARE_RATES = { 'Bike': 30, 'Rickshaw': 40, 'Car Mini': 50, 'Car AC': 70 };
const MIN_FARES  = { 'Bike': 50, 'Rickshaw': 70, 'Car Mini': 100, 'Car AC': 150 };
const TILE_URL   = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';

// ── State ─────────────────────────────────────────────────────────────────
let token = localStorage.getItem('rh_token');
let user  = JSON.parse(localStorage.getItem('rh_user') || 'null');
let map, pickupMarker, dropoffMarker, routeLine, driverMarker;
let pickup = null, dropoff = null;
let mapMode = 'pickup'; // 'pickup' | 'dropoff' | 'idle'
let selectedVehicle = 'Bike';
let activeRide = null;
let socket = null;
let locationWatchId = null;

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.className = 'toast', 3000);
}

// ── Auth ───────────────────────────────────────────────────────────────────
function switchTab(t) {
  document.getElementById('login-form').style.display    = t === 'login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = t === 'register' ? 'block' : 'none';
  document.querySelectorAll('.auth-tab').forEach((b, i) => b.classList.toggle('active', (i === 0) === (t === 'login')));
  document.getElementById('auth-error').textContent = '';
}

async function apiCall(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  try {
    const res = await apiCall('/api/auth/login', 'POST', { email, password: pass });
    saveSession(res);
  } catch (e) { document.getElementById('auth-error').textContent = e.message; }
}

async function doRegister() {
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const phone = document.getElementById('r-phone').value.trim();
  const pass  = document.getElementById('r-pass').value;
  try {
    const res = await apiCall('/api/auth/register', 'POST', { name, email, phone, password: pass, role: 'customer' });
    saveSession(res);
  } catch (e) { document.getElementById('auth-error').textContent = e.message; }
}

function saveSession(res) {
  token = res.token; user = res.user;
  localStorage.setItem('rh_token', token);
  localStorage.setItem('rh_user', JSON.stringify(user));
  bootApp();
}

function doLogout() {
  localStorage.clear();
  token = null; user = null; activeRide = null;
  if (socket) socket.disconnect();
  if (locationWatchId) navigator.geolocation.clearWatch(locationWatchId);
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('active-ride').style.display = 'none';
  document.getElementById('sos-btn').style.display = 'none';
}

// ── Boot App ───────────────────────────────────────────────────────────────
function bootApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sos-btn').style.display = 'block';
  document.getElementById('avatar-init').textContent = (user.name || '?')[0].toUpperCase();
  document.getElementById('header-name').textContent = user.name || user.email;

  initMap();
  connectSocket();
  loadWallet();
  loadRideHistory();
}

// ── Map ────────────────────────────────────────────────────────────────────
function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false }).setView([31.5204, 74.3587], 13);
  L.tileLayer(TILE_URL, { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  map.on('click', (e) => {
    const { lat, lng } = e.latlng;
    if (mapMode === 'pickup') {
      setPickup(lat, lng);
    } else if (mapMode === 'dropoff') {
      setDropoff(lat, lng);
    }
  });

  // Try to get user location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    }, () => {});
  }
}

function createCircleIcon(cls) {
  return L.divIcon({ className: cls, iconSize: [18, 18], iconAnchor: [9, 9] });
}

async function reverseGeocode(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
    const d = await r.json();
    return d.display_name ? d.display_name.split(',').slice(0, 2).join(',') : `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  } catch { return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
}

async function setPickup(lat, lng) {
  pickup = { lat, lng };
  if (pickupMarker) pickupMarker.remove();
  pickupMarker = L.marker([lat, lng], { icon: createCircleIcon('pickup-marker') }).addTo(map);
  document.getElementById('pickup-input').value = 'Locating…';
  document.getElementById('pickup-input').classList.add('has-val');
  const addr = await reverseGeocode(lat, lng);
  pickup.address = addr;
  document.getElementById('pickup-input').value = addr;

  // Switch to dropoff mode
  mapMode = 'dropoff';
  const hint = document.getElementById('map-hint');
  hint.textContent = 'Now tap to set dropoff location';
  hint.className = 'map-hint dropoff-mode';
  if (dropoff) updateFare();
}

async function setDropoff(lat, lng) {
  dropoff = { lat, lng };
  if (dropoffMarker) dropoffMarker.remove();
  dropoffMarker = L.marker([lat, lng], { icon: createCircleIcon('dropoff-marker') }).addTo(map);
  document.getElementById('dropoff-input').value = 'Locating…';
  document.getElementById('dropoff-input').classList.add('has-val');
  const addr = await reverseGeocode(lat, lng);
  dropoff.address = addr;
  document.getElementById('dropoff-input').value = addr;

  mapMode = 'idle';
  document.getElementById('map-hint').style.display = 'none';
  if (pickup) { await drawRoute(); updateFare(); }
}

async function drawRoute() {
  if (routeLine) routeLine.remove();
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${pickup.lng},${pickup.lat};${dropoff.lng},${dropoff.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.routes && d.routes[0]) {
      const coords = d.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      routeLine = L.polyline(coords, { color: '#f5c518', weight: 4, opacity: .8 }).addTo(map);
      map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
      return d.routes[0].distance / 1000; // km
    }
  } catch {}
  // Fallback straight line
  routeLine = L.polyline([[pickup.lat, pickup.lng], [dropoff.lat, dropoff.lng]], { color: '#f5c518', weight: 4, dashArray: '8,8' }).addTo(map);
  return haversine(pickup.lat, pickup.lng, dropoff.lat, dropoff.lng);
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateFare() {
  if (!pickup || !dropoff) return;
  const dist = haversine(pickup.lat, pickup.lng, dropoff.lat, dropoff.lng);
  const rate  = FARE_RATES[selectedVehicle] || 50;
  const min   = MIN_FARES[selectedVehicle] || 100;
  const fare  = Math.max(Math.round(dist * rate), min);
  document.getElementById('fare-display').textContent = `Rs ${fare}`;
  document.getElementById('fare-row').style.display  = 'flex';
  document.getElementById('book-btn').style.display  = 'block';
}

function selectVehicle(btn) {
  document.querySelectorAll('.vehicle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedVehicle = btn.dataset.type;
  updateFare();
}

// ── Book Ride ──────────────────────────────────────────────────────────────
async function bookRide() {
  if (!pickup || !dropoff) return showToast('Set pickup & dropoff first', 'error');
  const dist = haversine(pickup.lat, pickup.lng, dropoff.lat, dropoff.lng);
  const fare = Math.max(Math.round(dist * (FARE_RATES[selectedVehicle]||50)), MIN_FARES[selectedVehicle]||100);
  try {
    const ride = await apiCall('/api/rides', 'POST', {
      pickupLocation:  { ...pickup },
      dropoffLocation: { ...dropoff },
      fare, distance: +dist.toFixed(2),
      vehicleType: selectedVehicle
    });
    activeRide = ride;
    showActiveRide(ride);
    connectToRideRoom(ride._id);
    showToast('Ride requested! Finding a driver…', 'success');
  } catch (e) { showToast(e.message, 'error'); }
}

function showActiveRide(ride) {
  document.getElementById('active-ride').style.display = 'block';
  document.getElementById('bottom-panel').style.display = 'none';
  document.getElementById('ride-status-text').textContent = statusLabel(ride.status);
  document.getElementById('ar-fare').textContent = `Rs ${ride.fare}`;
  document.getElementById('ar-vehicle').textContent = ride.vehicleType || '—';
  document.getElementById('ar-driver').textContent = ride.driver?.name || 'Finding…';
}

function statusLabel(s) {
  return { requested:'Finding driver…', accepted:'Driver on the way!', arrived:'Driver arrived!', 'in-progress':'On the ride!', completed:'Ride complete!', cancelled:'Ride cancelled' }[s] || s;
}

async function cancelRide() {
  if (!activeRide) return;
  try {
    await apiCall(`/api/rides/${activeRide._id}/cancel`, 'PATCH');
    endRide();
    showToast('Ride cancelled', 'info');
  } catch (e) { showToast(e.message, 'error'); }
}

function endRide() {
  activeRide = null;
  document.getElementById('active-ride').style.display = 'none';
  document.getElementById('bottom-panel').style.display = 'block';
  if (pickupMarker)  { pickupMarker.remove();  pickupMarker  = null; }
  if (dropoffMarker) { dropoffMarker.remove(); dropoffMarker = null; }
  if (routeLine)     { routeLine.remove();     routeLine     = null; }
  if (driverMarker)  { driverMarker.remove();  driverMarker  = null; }
  pickup = null; dropoff = null; mapMode = 'pickup';
  document.getElementById('pickup-input').value  = '';
  document.getElementById('dropoff-input').value = '';
  document.getElementById('pickup-input').classList.remove('has-val');
  document.getElementById('dropoff-input').classList.remove('has-val');
  document.getElementById('fare-row').style.display = 'none';
  document.getElementById('book-btn').style.display = 'none';
  document.getElementById('map-hint').style.display = 'block';
  document.getElementById('map-hint').className = 'map-hint';
  document.getElementById('map-hint').textContent = 'Tap on the map to set pickup location';
  loadWallet(); loadRideHistory();
}

// ── Socket.io ─────────────────────────────────────────────────────────────
function connectSocket() {
  if (socket) return;
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => console.warn('Socket error:', e.message));
}

function connectToRideRoom(rideId) {
  if (!socket) return;
  socket.emit('ride:join', rideId);

  socket.on('ride:accepted', ({ driver }) => {
    document.getElementById('ar-driver').textContent = driver.name;
    document.getElementById('ride-status-text').textContent = 'Driver on the way!';
    showToast(`${driver.name} accepted your ride!`, 'success');
  });

  socket.on('ride:status', ({ status }) => {
    document.getElementById('ride-status-text').textContent = statusLabel(status);
    if (status === 'completed') {
      showToast('Ride completed! Have a great day 🎉', 'success');
      setTimeout(endRide, 2000);
    } else if (status === 'cancelled') {
      showToast('Ride was cancelled', 'error');
      setTimeout(endRide, 1500);
    } else if (status === 'arrived') {
      showToast('Your driver has arrived!', 'info');
    }
  });

  socket.on('driver:location', ({ lat, lng }) => {
    if (driverMarker) driverMarker.remove();
    driverMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: 'driver-marker', html: '🚗', iconSize: [28, 28], iconAnchor: [14, 14] })
    }).addTo(map);
  });
}

// ── Share Location ─────────────────────────────────────────────────────────
function shareLocation() {
  if (!navigator.geolocation) return showToast('Geolocation not supported', 'error');
  if (locationWatchId) {
    navigator.geolocation.clearWatch(locationWatchId);
    locationWatchId = null;
    showToast('Location sharing stopped', 'info');
    return;
  }
  locationWatchId = navigator.geolocation.watchPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    if (socket && activeRide) {
      socket.emit('location:share', { lat, lng, rideId: activeRide._id });
    }
  }, () => {}, { enableHighAccuracy: true });
  showToast('Sharing your live location', 'success');
}

// ── SOS ────────────────────────────────────────────────────────────────────
async function triggerSOS() {
  if (!confirm('🆘 Send SOS emergency alert?\n\nThis will alert all nearby support.')) return;
  try {
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 5000 }));
    await apiCall('/api/sos', 'POST', {
      location: { lat: pos.coords.latitude, lng: pos.coords.longitude },
      message: 'Customer SOS alert!',
      rideId: activeRide?._id || null
    });
    showToast('🆘 SOS alert sent! Help is on the way.', 'error');
  } catch {
    await apiCall('/api/sos', 'POST', { location: { lat: 0, lng: 0 }, message: 'Customer SOS alert!' });
    showToast('🆘 SOS alert sent!', 'error');
  }
}

// ── Wallet ─────────────────────────────────────────────────────────────────
async function loadWallet() {
  try {
    const w = await apiCall('/api/wallet');
    document.getElementById('wallet-balance').textContent = (+w.balance).toLocaleString();
    const txList = document.getElementById('tx-list');
    const txs = (w.transactions || []).slice().reverse();
    if (!txs.length) { txList.innerHTML = '<div class="empty-msg">No transactions yet</div>'; return; }
    txList.innerHTML = txs.map(tx => `
      <div class="tx-item">
        <div><div class="tx-desc">${tx.description || tx.type}</div><div class="tx-date">${new Date(tx.createdAt).toLocaleDateString()}</div></div>
        <div class="tx-amount ${tx.type}">${tx.type === 'credit' ? '+' : '-'}Rs ${(+tx.amount).toLocaleString()}</div>
      </div>`).join('');
  } catch {}
}

async function addFunds() {
  const amt = parseFloat(document.getElementById('fund-amount').value);
  if (!amt || amt < 100) return showToast('Minimum top-up is Rs 100', 'error');
  try {
    await apiCall('/api/wallet/add-funds', 'POST', { amount: amt });
    document.getElementById('fund-amount').value = '';
    await loadWallet();
    showToast(`Rs ${amt.toLocaleString()} added to wallet!`, 'success');
  } catch (e) { showToast(e.message, 'error'); }
}

// ── Ride History ───────────────────────────────────────────────────────────
async function loadRideHistory() {
  try {
    const rides = await apiCall('/api/rides/my');
    const el = document.getElementById('ride-history-list');
    if (!rides.length) { el.innerHTML = '<div class="empty-msg">No rides yet. Book your first ride!</div>'; return; }
    el.innerHTML = rides.map(r => `
      <div class="ride-history-item ${r.status}">
        <div class="rh-route">${r.pickupLocation?.address || 'Pickup'} <span>→</span> ${r.dropoffLocation?.address || 'Dropoff'}</div>
        <div class="rh-meta">
          <span class="status-pill ${r.status}">${r.status}</span>
          <span class="rh-fare">Rs ${r.fare}</span>
          <span>${new Date(r.createdAt).toLocaleDateString()}</span>
        </div>
      </div>`).join('');
  } catch {}
}

// ── Tab Navigation ─────────────────────────────────────────────────────────
function switchAppTab(name) {
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['book','rides','wallet'][i] === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'wallet') loadWallet();
  if (name === 'rides')  loadRideHistory();
}

// ── Init ───────────────────────────────────────────────────────────────────
if (token && user) bootApp();
else {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
</script>
